<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أرشيف السيرة الذاتية · CV Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================= DESIGN TOKENS ============================= */
:root{
  --ink-950:#0B0C10;
  --ink-900:#111318;
  --ink-800:rgba(255,255,255,0.045);
  --ink-750:rgba(255,255,255,0.055);
  --ink-700:rgba(255,255,255,0.09);
  --ink-600:rgba(255,255,255,0.13);
  --paper-100:#E7E8ED;
  --paper-300:#AEB1BC;
  --paper-500:#787C88;
  --accent-300:#9DB4E8;
  --accent-500:#5E82D6;
  --accent-700:#3F5CA8;
  --accent-rgb:94,130,214;
  --accent2-300:#96D2C4;
  --accent2-500:#4FA895;
  --accent2-700:#357569;
  --accent2-rgb:79,168,149;
  --good-500:#4CAD79;
  --good-300:#96CBAE;
  --bad-500:#D46577;
  --bad-300:#E5A3B0;
  --glass-border:rgba(255,255,255,0.10);
  --glow-accent:0 4px 16px -6px rgba(var(--accent-rgb),0.3);
  --glow-accent2:0 4px 14px -6px rgba(var(--accent2-rgb),0.25);
  --radius-sm:8px;
  --radius-md:14px;
  --radius-lg:20px;
  --font-ar:'IBM Plex Sans Arabic',system-ui,sans-serif;
  --font-en:'IBM Plex Sans',system-ui,sans-serif;
  --font-display:'Space Grotesk','IBM Plex Sans',system-ui,sans-serif;
  --font-serif:Georgia,'Times New Roman',serif;
  --font-mono:'IBM Plex Mono',monospace;
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important; }
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ink-950);
  color:var(--paper-100);
  font-family:var(--font-ar);
  font-size:15px;
  line-height:1.6;
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  z-index:0;
  background:
    radial-gradient(ellipse 800px 620px at 12% 6%, rgba(var(--accent-rgb),0.07), transparent 62%),
    radial-gradient(ellipse 720px 720px at 92% 26%, rgba(var(--accent2-rgb),0.06), transparent 60%);
  animation: ambientDrift 40s ease-in-out infinite alternate;
  pointer-events:none;
}
@keyframes ambientDrift{
  0%{ transform:translate(0,0) scale(1); }
  100%{ transform:translate(-2%,1.5%) scale(1.04); }
}

html[dir="ltr"] body{font-family:var(--font-en);}
[dir="ltr"]{font-family:var(--font-en);}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;}
::selection{background:var(--accent-500);color:#fff;}

::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--ink-900);}
::-webkit-scrollbar-thumb{background:var(--ink-600);border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:var(--accent2-700);}

a{color:var(--accent2-300);}

/* ============================= APP SHELL ============================= */
.app-shell{
  display:flex;
  min-height:100vh;
  max-width:1400px;
  margin:0 auto;
  position:relative;
  z-index:1;
}

/* -------- rail (folder-tab navigation) -------- */
.rail{
  width:230px;
  flex-shrink:0;
  padding:28px 14px;
  background:var(--ink-900);
  border-inline-start:1px solid var(--ink-700);
  display:flex;
  flex-direction:column;
  gap:6px;
}
.rail-brand{
  padding:6px 12px 18px 12px;
}
.rail-brand .stamp-mark{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:.14em;
  color:var(--accent-300);
  text-transform:uppercase;
  border:1px solid rgba(var(--accent-rgb),0.35);
  background:rgba(var(--accent-rgb),0.08);
  display:inline-block;
  padding:3px 8px;
  border-radius:4px;
  margin-bottom:10px;
}
.rail-brand h1{
  font-size:21px;
  color:var(--paper-100);
  line-height:1.3;
}
.rail-brand p{
  margin:6px 0 0;
  font-size:12.5px;
  color:var(--paper-500);
  line-height:1.5;
}
.lang-switch{
  display:flex;
  gap:4px;
  background:var(--ink-800);
  border:1px solid var(--ink-700);
  border-radius:20px;
  padding:3px;
  width:fit-content;
  margin:0 12px 18px;
  flex-shrink:0;
}
.lang-btn{
  background:none;
  border:none;
  color:var(--paper-500);
  font-family:var(--font-mono);
  font-size:11px;
  padding:5px 12px;
  border-radius:16px;
  cursor:pointer;
  transition:background .15s ease, color .15s ease;
  white-space:nowrap;
}
.lang-btn.active{background:var(--accent-500);color:#fff;font-weight:600;}
.lang-btn:hover:not(.active){color:var(--paper-100);}
.rail-tab{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 14px;
  border-radius:var(--radius-md) 0 0 var(--radius-md);
  cursor:pointer;
  color:var(--paper-300);
  font-size:14.5px;
  font-weight:500;
  border:1px solid transparent;
  border-inline-end:none;
  background:transparent;
  position:relative;
  transition:background .15s ease, color .15s ease;
}
.rail-tab .tab-num{
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--paper-500);
  min-width:16px;
}
.rail-tab:hover{background:var(--ink-800);color:var(--paper-100);}
.rail-tab.active{
  background:var(--ink-800);
  color:var(--paper-100);
  border-color:var(--ink-700);
  margin-inline-end:-1px;
}
.rail-tab.active .tab-num{color:var(--accent-500);}
.rail-tab.active::after{
  content:'';
  position:absolute;
  inset-inline-end:-1px;
  top:0;bottom:0;width:3px;
  background:var(--accent-500);
  border-radius:0 3px 3px 0;
}
.rail-foot{
  margin-top:auto;
  padding:12px;
  font-size:11.5px;
  color:var(--paper-500);
  font-family:var(--font-mono);
  line-height:1.6;
  border-top:1px solid var(--ink-700);
}

/* -------- main panel -------- */
.main{
  flex:1;
  min-width:0;
  padding:32px 40px 60px;
  background:var(--ink-900);
  border-inline-start:1px solid var(--ink-700);
}
.panel{display:none;}
.panel.active{display:block;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

.panel-head{margin-bottom:26px;}
.panel-head h2{font-size:24px;color:var(--paper-100);}
.panel-head p{margin:8px 0 0;color:var(--paper-500);font-size:14px;max-width:640px;}

/* ============================= CARDS & SECTIONS ============================= */
.card{
  background:var(--ink-800);
  border:1px solid var(--ink-700);
  border-radius:var(--radius-lg);
  padding:22px;
  margin-bottom:16px;
  transition:border-color .2s ease, transform .2s ease;
}
.card:hover{border-color:var(--glass-border); transform:translateY(-2px);}
.card-title{
  font-family:var(--font-mono);
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--accent2-300);
  margin-bottom:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.section-block{margin-bottom:34px;}
.section-block-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:14px;
  padding-bottom:10px;
  border-bottom:1px solid var(--ink-700);
}
.section-block-head h3{font-size:16px;color:var(--paper-100);}
.section-block-head .count{
  font-family:var(--font-mono);
  font-size:11.5px;
  color:var(--paper-500);
}
.empty-note{
  color:var(--paper-500);
  font-size:13.5px;
  padding:18px 4px;
  border:1px dashed var(--ink-600);
  border-radius:var(--radius-md);
  text-align:center;
}

/* item card (record) */
.item-card{
  background:var(--ink-750);
  border:1px solid var(--ink-700);
  border-radius:var(--radius-md);
  padding:16px 18px;
  margin-bottom:10px;
  position:relative;
  transition:border-color .2s ease, transform .2s ease;
}
.item-card:hover{border-color:var(--glass-border); transform:translateY(-1px);}
.item-card .stamp{
  position:absolute;
  top:14px;
  inset-inline-end:16px;
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:.07em;
  text-transform:uppercase;
  color:var(--accent-300);
  border:1px solid rgba(var(--accent-rgb),0.3);
  border-radius:20px;
  padding:3px 10px;
  background:rgba(var(--accent-rgb),0.1);
}
.item-card-top{padding-inline-end:120px;}
.item-title{font-size:15px;font-weight:600;color:var(--paper-100);}
.item-sub{font-size:12.5px;color:var(--paper-500);margin-top:3px;font-family:var(--font-mono);}
.item-body{margin-top:10px;font-size:13.5px;color:var(--paper-300);}
.item-body ul{margin:6px 0 0;padding-inline-start:18px;}
.item-body li{margin-bottom:3px;}
.item-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.chip{
  font-size:11.5px;
  font-family:var(--font-mono);
  background:var(--ink-800);
  border:1px solid var(--ink-600);
  color:var(--accent2-300);
  padding:3px 9px;
  border-radius:20px;
}
.item-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
  padding-top:10px;
  border-top:1px solid var(--ink-700);
}

/* ============================= FORM ELEMENTS ============================= */
label{display:block;font-size:12.5px;color:var(--paper-500);margin-bottom:6px;font-weight:500;}
input[type=text],input[type=password],input[type=email],textarea,select{
  width:100%;
  background:var(--ink-900);
  border:1px solid var(--ink-600);
  color:var(--paper-100);
  border-radius:var(--radius-sm);
  padding:10px 12px;
  font-family:inherit;
  font-size:13.5px;
  transition:border-color .15s ease;
}
textarea{resize:vertical;min-height:90px;line-height:1.5;}
input:focus,textarea:focus,select:focus{
  outline:none;
  border-color:var(--accent-500);
  box-shadow:0 0 0 3px rgba(var(--accent-rgb),0.15);
}
.field{margin-bottom:14px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.checkbox-field{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.checkbox-field input{width:auto;}
.checkbox-field label{margin:0;color:var(--paper-300);}
.hint{font-size:11.5px;color:var(--paper-500);margin-top:5px;}

.edit-form{
  background:var(--ink-750);
  border:1px solid rgba(var(--accent-rgb),0.3);
  border-radius:var(--radius-md);
  padding:18px;
  margin-bottom:10px;
}
.edit-form-title{
  font-family:var(--font-mono);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--accent-500);
  margin-bottom:14px;
}

/* ============================= BUTTONS ============================= */
.btn{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:10px 18px;
  border-radius:var(--radius-sm);
  font-family:inherit;
  font-size:13.5px;
  font-weight:600;
  border:1px solid transparent;
  cursor:pointer;
  transition:filter .15s ease, transform .1s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{
  background:var(--accent-500);
  color:#fff;
  box-shadow:var(--glow-accent);
  transition:filter .15s ease, transform .15s ease, box-shadow .15s ease;
}
.btn-primary:hover:not(:disabled){filter:brightness(1.1); transform:translateY(-1px);}
.btn-ghost{background:transparent;color:var(--paper-300);border-color:var(--ink-600);}
.btn-ghost:hover:not(:disabled){border-color:var(--accent2-500);color:var(--paper-100);}
.btn-danger{background:transparent;color:var(--bad-300);border-color:var(--bad-500);}
.btn-danger:hover:not(:disabled){background:rgba(212,101,119,0.12);}
.btn-sm{padding:6px 12px;font-size:12.5px;}
.btn-block{width:100%;justify-content:center;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;}

/* ============================= STATUS / BANNERS ============================= */
.status{
  border-radius:var(--radius-md);
  padding:12px 16px;
  font-size:13px;
  margin:14px 0;
  display:none;
  align-items:flex-start;
  gap:10px;
}
.status.show{display:flex;}
.status-error{background:rgba(212,101,119,0.1);border:1px solid var(--bad-500);color:var(--bad-300);}
.status-success{background:rgba(76,173,121,0.1);border:1px solid var(--good-500);color:var(--good-300);}
.status-info{background:rgba(var(--accent2-rgb),0.1);border:1px solid var(--accent2-500);color:var(--accent2-300);}
.spinner{
  width:15px;height:15px;border-radius:50%;
  border:2px solid rgba(157,180,232,.25);
  border-top-color:var(--accent-500);
  animation:spin .7s linear infinite;
  flex-shrink:0;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ============================= STYLE SWATCH PICKER ============================= */
.style-picker{display:flex;gap:14px;margin-bottom:22px;}
.style-swatch{
  flex:1;
  border:1.5px solid var(--ink-600);
  border-radius:var(--radius-md);
  padding:16px;
  cursor:pointer;
  transition:border-color .15s ease;
}
.style-swatch.selected{border-color:var(--accent-500);background:rgba(var(--accent-rgb),0.07);}
.style-swatch-preview{
  height:60px;border-radius:6px;margin-bottom:10px;
  display:flex;flex-direction:column;overflow:hidden;
}
.style-swatch-preview.simple{background:#fff;}
.style-swatch-preview.simple .bar{height:10px;background:#333;width:55%;margin:8px 0 4px 8px;}
.style-swatch-preview.simple .line{height:3px;background:#ccc;width:75%;margin:3px 0 0 8px;}
.style-swatch-preview.professional{background:#fff;}
.style-swatch-preview.professional .band{height:22px;background:var(--accent2-700);}
.style-swatch-preview.professional .bar{height:8px;background:#333;width:50%;margin:8px 0 4px 8px;}
.style-swatch-preview.professional .line{height:3px;background:#ccc;width:65%;margin:3px 0 0 8px;}
.style-swatch h4{font-size:13.5px;color:var(--paper-100);margin:0 0 3px;}
.style-swatch p{font-size:12px;color:var(--paper-500);margin:0;}

/* ============================= RESULTS ============================= */
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;}
.result-col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.result-col-head h4{font-size:13.5px;color:var(--paper-100);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.05em;}
.preview-frame{
  background:#fff;
  color:#1a1a1a;
  border-radius:var(--radius-md);
  padding:0;
  max-height:640px;
  overflow-y:auto;
  border:1px solid var(--ink-700);
  transition:border-color .2s ease;
}
.preview-frame.editing{
  background:var(--ink-900);
  color:var(--paper-100);
  padding:18px;
  border-color:rgba(var(--accent-rgb),0.3);
}
.domain-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-family:var(--font-mono);
  font-size:11.5px;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--accent-300);
  border:1px solid rgba(var(--accent-rgb),0.3);
  border-radius:20px;
  padding:5px 13px;
  margin-bottom:18px;
  background:rgba(var(--accent-rgb),0.08);
}

/* ============================= MATCH ANALYSIS ============================= */
.match-percentage-row{display:flex;align-items:center;gap:16px;margin-bottom:18px;}
.match-percentage-value{font-family:var(--font-display);font-size:32px;font-weight:700;color:var(--paper-100);min-width:76px;}
.match-percentage-bar{flex:1;height:8px;background:var(--ink-700);border-radius:20px;overflow:hidden;}
.match-percentage-fill{height:100%;background:var(--accent-500);border-radius:20px;transition:width .6s ease;}
.match-sub-block{margin-bottom:14px;}
.match-sub-block:last-child{margin-bottom:0;}
.match-sub-label{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent2-300);margin-bottom:6px;}
.match-sub-block p{font-size:13.5px;color:var(--paper-300);line-height:1.65;margin:0;}

/* ============================= INTERVIEW PREP ============================= */
.interview-section-label{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent2-300);margin-bottom:10px;}
.interview-question-card{background:var(--ink-750);border:1px solid var(--ink-700);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:10px;}
.interview-question-cat{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-300);margin-bottom:6px;}
.interview-question-text{font-size:14px;font-weight:600;color:var(--paper-100);margin-bottom:6px;}
.interview-question-guidance{font-size:12.5px;color:var(--paper-300);line-height:1.55;}
.interview-weakpoint-card{background:var(--ink-750);border:1px solid var(--ink-700);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:10px;}
.interview-weakpoint-concern{font-size:13.5px;font-weight:600;color:var(--paper-100);margin-bottom:6px;}
.interview-weakpoint-answer{font-size:12.5px;color:var(--paper-300);line-height:1.6;}
.interview-list{margin:0;padding-inline-start:20px;}
.interview-list li{font-size:13.5px;color:var(--paper-300);margin-bottom:8px;line-height:1.55;}

/* ============================= CHAT (guided refinement) ============================= */
.chat-log{
  max-height:360px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:4px 2px 14px;
  margin-bottom:14px;
}
.chat-bubble{
  max-width:80%;
  padding:11px 15px;
  border-radius:var(--radius-md);
  font-size:13.5px;
  line-height:1.65;
}
.chat-bubble.user{align-self:flex-end;background:var(--accent-500);color:#fff;}
.chat-bubble.assistant{align-self:flex-start;background:var(--ink-750);border:1px solid var(--ink-700);}
.chat-bubble.loading{font-family:var(--font-mono);font-size:12px;color:var(--paper-500);display:flex;align-items:center;gap:8px;}
.chat-empty{color:var(--paper-500);font-size:13px;text-align:center;padding:22px 10px;}
.chat-suggestions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.chat-suggestion-chip{
  font-size:12px;
  font-family:inherit;
  background:var(--ink-800);
  border:1px solid var(--ink-600);
  color:var(--accent2-300);
  padding:6px 13px;
  border-radius:20px;
  cursor:pointer;
  transition:border-color .15s ease, color .15s ease;
}
.chat-suggestion-chip:hover{border-color:var(--accent-500);color:var(--paper-100);}
.chat-input-row{display:flex;gap:10px;}
.chat-input-row input{flex:1;}

/* ============================= PDF TEMPLATES (rendered off-screen + inside preview) ============================= */
.pdf-doc{font-family:var(--font-en);width:100%;color:#1a1a1a;}
.pdf-doc *{box-sizing:border-box;}
.pdf-doc h1,.pdf-doc h2,.pdf-doc h3{font-family:var(--font-en);margin:0;}

/* simple CV/letter */
.pdf-simple{padding:46px 50px;}
.pdf-simple .name{font-family:var(--font-serif);font-size:27px;font-weight:700;color:#161A21;}
.pdf-simple .headline{font-size:13px;color:#48586C;margin-top:3px;letter-spacing:.02em;}
.pdf-simple .contact{font-size:11px;color:#555;margin-top:8px;}
.pdf-simple .contact span{margin-inline-end:14px;}
.pdf-simple hr{border:none;border-top:1.5px solid #1a1a1a;margin:16px 0 18px;}
.pdf-simple .sec-title{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:#161A21;border-bottom:1px solid #ccc;padding-bottom:4px;margin:20px 0 10px;}
.pdf-simple .sec-title:first-of-type{margin-top:0;}
.pdf-simple .entry{margin-bottom:13px;break-inside:avoid;}
.pdf-simple .entry-top{display:flex;justify-content:space-between;font-size:13px;}
.pdf-simple .entry-title{font-weight:700;}
.pdf-simple .entry-org{font-weight:400;color:#333;}
.pdf-simple .entry-date{font-size:11px;color:#666;white-space:nowrap;}
.pdf-simple .entry ul{margin:5px 0 0;padding-inline-start:16px;font-size:12px;color:#222;}
.pdf-simple .entry li{margin-bottom:3px;}
.pdf-simple .summary-text{font-size:12.5px;color:#222;line-height:1.6;}
.pdf-simple .skills-line{font-size:12px;color:#222;line-height:1.7;}
.pdf-simple .skills-line b{color:#161A21;}

/* professional CV/letter */
.pdf-pro-band{background:#252B35;color:#EDE7DA;padding:34px 50px 26px;}
.pdf-pro-band .name{font-family:var(--font-serif);font-size:29px;font-weight:700;color:#fff;}
.pdf-pro-band .headline{font-size:13.5px;color:#E3C182;margin-top:4px;}
.pdf-pro-band .contact{font-size:10.5px;color:#C9C3B4;margin-top:12px;}
.pdf-pro-band .contact span{margin-inline-end:14px;}
.pdf-pro-body{padding:28px 50px 46px;}
.pdf-pro-body .sec-title{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:#48586C;border-bottom:1.5px solid #6E88A6;padding-bottom:4px;margin:22px 0 10px;}
.pdf-pro-body .sec-title:first-of-type{margin-top:0;}
.pdf-pro-body .entry{margin-bottom:13px;break-inside:avoid;}
.pdf-pro-body .entry-top{display:flex;justify-content:space-between;font-size:13px;}
.pdf-pro-body .entry-title{font-weight:700;color:#161A21;}
.pdf-pro-body .entry-org{font-weight:400;color:#333;}
.pdf-pro-body .entry-date{font-size:11px;color:#666;white-space:nowrap;}
.pdf-pro-body .entry ul{margin:5px 0 0;padding-inline-start:16px;font-size:12px;color:#222;}
.pdf-pro-body .entry li{margin-bottom:3px;}
.pdf-pro-body .summary-text{font-size:12.5px;color:#222;line-height:1.6;}
.pdf-pro-body .skill-chip{display:inline-block;font-size:11px;border:1px solid #C99A4B;color:#8F6B2E;border-radius:20px;padding:3px 11px;margin:0 5px 6px 0;}

/* cover letter specific */
.pdf-letter-body{padding:50px;}
.pdf-letter-body .date{font-size:12px;color:#555;margin-bottom:22px;}
.pdf-letter-body .salutation{font-size:13px;margin-bottom:14px;font-weight:600;}
.pdf-letter-body p{font-size:12.5px;line-height:1.75;color:#222;margin:0 0 13px;}
.pdf-letter-body .closing{margin-top:20px;}
.pdf-letter-body .closing .name{font-family:var(--font-serif);font-size:15px;font-weight:700;margin-top:26px;color:#161A21;}

/* pdf-stage no longer used — PDF export now opens a clean print window */

/* ============================= LANDING PAGE ============================= */
.landing{
  position:fixed;inset:0;z-index:100;
  background:var(--ink-950);
  display:flex;align-items:center;justify-content:center;
  overflow-y:auto;
  padding:40px 20px;
}
.landing.hidden{display:none;}
.landing-inner{max-width:680px;text-align:center;}
.landing-badge{
  display:inline-block;
  font-family:var(--font-mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent-300);
  border:1px solid rgba(var(--accent-rgb),0.35);background:rgba(var(--accent-rgb),0.08);
  padding:5px 16px;border-radius:20px;margin-bottom:28px;
}
.landing-title{font-family:var(--font-display);font-size:42px;font-weight:700;color:var(--paper-100);line-height:1.2;margin:0 0 16px;}
.landing-sub{font-size:16px;color:var(--paper-500);line-height:1.65;margin:0 0 40px;max-width:520px;margin-left:auto;margin-right:auto;}
.landing-features{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:40px;}
.landing-feature{background:var(--ink-800);border:1px solid var(--ink-700);border-radius:var(--radius-lg);padding:22px 18px;text-align:center;transition:border-color .2s ease, transform .2s ease;}
.landing-feature:hover{border-color:var(--glass-border);transform:translateY(-2px);}
.landing-feature-icon{font-size:28px;margin-bottom:12px;}
.landing-feature h3{font-family:var(--font-display);font-size:15px;color:var(--paper-100);margin:0 0 8px;}
.landing-feature p{font-size:13px;color:var(--paper-500);margin:0;line-height:1.5;}
.btn-lg{padding:14px 36px;font-size:16px;border-radius:var(--radius-md);}
.landing-contact{margin-top:36px;font-size:13px;color:var(--paper-500);}
.landing-contact a{color:var(--accent2-300);}
@media(max-width:700px){
  .landing-title{font-size:28px;}
  .landing-features{grid-template-columns:1fr;gap:14px;}
}

/* ============================= SAVED JOBS ============================= */
.modal-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,0.6);
  display:none;align-items:center;justify-content:center;
  padding:20px;
}
.modal-overlay.show{display:flex;}
.modal-box{
  background:var(--ink-900);
  border:1px solid var(--ink-700);
  border-radius:var(--radius-lg);
  padding:28px;
  width:100%;max-width:420px;
}
.modal-box h3{font-family:var(--font-display);font-size:18px;color:var(--paper-100);margin:0 0 16px;}
.saved-job-card{
  background:var(--ink-800);border:1px solid var(--ink-700);border-radius:var(--radius-lg);
  padding:18px 20px;margin-bottom:12px;
  display:flex;align-items:flex-start;gap:16px;
  transition:border-color .2s ease, transform .2s ease;
}
.saved-job-card:hover{border-color:var(--glass-border);transform:translateY(-1px);}
.saved-job-info{flex:1;min-width:0;}
.saved-job-domain{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-300);margin-bottom:4px;}
.saved-job-title{font-size:14.5px;font-weight:600;color:var(--paper-100);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.saved-job-match{font-family:var(--font-mono);font-size:12px;margin-bottom:4px;}
.saved-job-date{font-size:11.5px;color:var(--paper-500);font-family:var(--font-mono);}
.saved-job-actions{display:flex;gap:8px;flex-shrink:0;align-items:center;}
.star-btn{
  background:none;border:none;cursor:pointer;font-size:20px;
  color:var(--paper-500);transition:color .15s ease, transform .15s ease;
  padding:4px;
}
.star-btn:hover{transform:scale(1.15);}
.star-btn.starred{color:#f5c842;}

/* ============================= JSON IO / SETTINGS ============================= */
.kv-note{
  font-size:12.5px;color:var(--paper-500);
  background:var(--ink-800);border:1px solid var(--ink-700);
  border-radius:var(--radius-sm);padding:11px 14px;line-height:1.6;
}
.pw-wrap{position:relative;}
.pw-wrap input{padding-inline-end:70px;}
.pw-toggle{
  position:absolute;top:50%;transform:translateY(-50%);
  inset-inline-end:10px;
  background:none;border:none;color:var(--accent2-300);
  font-family:var(--font-mono);font-size:11px;cursor:pointer;
  padding:4px 6px;
}

/* ============================= THEME COLOR PICKER ============================= */
.theme-swatches{display:flex;gap:12px;flex-wrap:wrap;}
.theme-swatch{
  width:36px;height:36px;
  border-radius:50%;
  border:2px solid transparent;
  cursor:pointer;
  padding:0;
  transition:transform .15s ease, border-color .15s ease;
  position:relative;
}
.theme-swatch:hover{transform:scale(1.1);}
.theme-swatch.selected{border-color:var(--paper-100);}
.theme-swatch.selected::after{
  content:'✓';
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:14px;font-weight:700;
  text-shadow:0 1px 3px rgba(0,0,0,0.55);
}
.custom-color-row{display:flex;align-items:center;gap:12px;margin-top:16px;}
input[type=color]{
  width:44px;height:36px;
  border:1px solid var(--ink-600);
  border-radius:var(--radius-sm);
  background:var(--ink-900);
  cursor:pointer;
  padding:2px;
}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px;}
input[type=color]::-webkit-color-swatch{border-radius:5px;border:none;}

@media(max-width:900px){
  .app-shell{flex-direction:column;}
  .rail{width:100%;flex-direction:row;flex-wrap:wrap;overflow-x:auto;border-inline-start:none;border-bottom:1px solid var(--ink-700);}
  .rail-brand{display:none;}
  .rail-foot{display:none;}
  .lang-switch{margin:6px 4px;}
  .main{border-inline-start:none;padding:24px 18px 50px;}
  .field-row,.field-row-3,.result-grid,.style-picker{grid-template-columns:1fr;display:grid;}
  .style-picker{display:flex;flex-direction:column;}
}
</style>
</head>
<body>

<div class="app-shell">

    <div class="rail-tab" data-tab="generate"><span class="tab-num">03</span> <span data-i18n="tab_generate"></span></div>

  <!-- ============================= MAIN ============================= -->
  <main class="main">

    <!-- ===================== TAB 1: SETTINGS ===================== -->
    <section class="panel active" id="panel-settings">
      <div class="panel-head">
        <h2 data-i18n="settings_heading"></h2>

      <div class="card">

        </div>

      </div>

      <div class="card">

        <p style="font-size:13px;color:var(--paper-300);margin:0 0 14px;" data-i18n="localdata_desc"></p>
        <div class="btn-row">
          <button class="btn btn-ghost" id="exportAllBtn" data-i18n="btn_export_backup"></button>

        </div>
      </div>
    </section>

    <!-- ===================== TAB 2: DATABASE ===================== -->
    <section class="panel" id="panel-database">
      <div class="panel-head">
        <h2 data-i18n="db_heading"></h2>
        <p data-i18n="db_desc"></p>
      </div>

      <div class="card">
        <div class="card-title" data-i18n="db_card_add"></div>
        <div class="field">
          <label for="cvPasteArea" data-i18n="label_cv_paste"></label>
          <textarea id="cvPasteArea" rows="8" data-i18n-placeholder="placeholder_cv_paste"></textarea>
        </div>
        <button class="btn btn-primary" id="analyzeCvBtn" data-i18n="btn_analyze_cv"></button>
        <div class="status" id="dbStatus"></div>
      </div>

      <div class="section-block">
        <div class="section-block-head">
          <h3 data-i18n="section_personal_info"></h3>
        </div>
        <div id="personalInfoContainer"></div>
      </div>

      <div id="listSectionsContainer"></div>

      <div class="card">
        <div class="card-title" data-i18n="db_card_backup"></div>
        <div class="btn-row">
          <button class="btn btn-ghost" id="exportDbBtn" data-i18n="btn_export_json"></button>
          <button class="btn btn-ghost" id="importDbBtn" data-i18n="btn_import_json"></button>

        </div>
        <input type="file" id="importDbFile" accept=".json" style="display:none;">

    </section>

    <!-- ===================== TAB 3: GENERATE ===================== -->
    <section class="panel" id="panel-generate">

        <h2 data-i18n="gen_heading"></h2>
        <p data-i18n="gen_desc"></p>

        <div class="card-title" data-i18n="gen_card_jd"></div>
        <div class="field">

          <textarea id="jobDescArea" dir="ltr" rows="10" placeholder="Paste the full job description here..."></textarea>
        </div>
        <button class="btn btn-primary" id="startChatBtn" data-i18n="btn_start"></button>
        <div class="status" id="generateStatus"></div>
      </div>

      <div id="resultsWrap" style="display:none;">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;">
          <span class="domain-badge" id="domainBadge" style="margin-bottom:0;"></span>
          <button class="star-btn" id="saveJobBtn" type="button" title="Save">☆</button>
        </div>

        <div class="card" id="matchAnalysisCard" style="display:none;">
          <div class="card-title" data-i18n="match_analysis_title"></div>
          <div class="match-percentage-row">
            <div class="match-percentage-value" id="matchPercentageValue">—%</div>

            <p id="honestVerdictText"></p>
          </div>

        <div class="card" id="chatCard" style="display:none;">
          <div class="card-title">

          <div class="chat-input-row">
            <input type="text" id="chatInput" dir="rtl" data-i18n-placeholder="placeholder_chat_input">

        <div class="card">
          <div class="card-title" data-i18n="style_card_title"></div>

              <p data-i18n="style_pro_desc"></p>

          </div>

        <div class="result-grid">

            <div class="preview-frame" id="letterPreview"></div>

        <div class="card">

    <!-- ===================== TAB 4: SAVED JOBS ===================== -->
    <section class="panel" id="panel-saved">

        <h2 data-i18n="saved_heading"></h2>
        <p data-i18n="saved_desc"></p>
      </div>
      <div id="savedJobsList"></div>
    </section>

  </main>
</div>

<!-- ============================= LANDING PAGE ============================= -->

    <h1 class="landing-title" data-i18n="landing_title"></h1>

  <div class="modal-box">

<script>
/* =====================================================================
   CV ARCHIVE — application state, persistence, rendering, API calls
   ===================================================================== */

/* --------------------------- constants --------------------------- */
const STORAGE_KEY = 'cvArchiveState_v1';
const OPENAI_ENDPOINT = 'https://api.openai.com/v1/responses';
const DEFAULT_MODEL = 'gpt-5.6-sol';
const DEFAULT_THEME_COLOR = '#5E82D6';

/* --------------------------- i18n --------------------------- */
const I18N = {
  brand_title:              { ar:'أرشيف السيرة الذاتية', en:'CV Archive' },
  brand_tagline:             { ar:'قاعدة بيانات واحدة لخبراتك، سيرة ذاتية مختلفة لكل وظيفة.', en:'One database for your experience, a different CV for every job.' },
  tab_settings:              { ar:'الإعدادات', en:'Settings' },
  tab_database:              { ar:'قاعدة البيانات', en:'Database' },
  tab_generate:              { ar:'توليد CV', en:'Generate CV' },
  tab_saved:                 { ar:'الوظائف المحفوظة', en:'Saved Jobs' },

function t(key){
  const entry = I18N[key];
  if(!entry) return key;
  return entry[state.lang] || entry.ar || key;
}

/* =====================================================================
   THEME COLOR — one base color picked by the person, full shade ramp
   (light/base/dark for both a primary and an auto-derived secondary
   accent) computed from it and pushed onto CSS custom properties.
   ===================================================================== */
const THEME_PRESETS = [
  '#5E82D6', // blue (default)
  '#3EA599', // teal
  '#8577CC', // violet
  '#C99A5C', // amber
  '#5FAB78', // green
  '#C97690'  // rose
];

function hexToHsl(hex){
  const clean = /^#[0-9a-fA-F]{6}$/.test(hex) ? hex : DEFAULT_THEME_COLOR;
  const r = parseInt(clean.slice(1,3),16)/255;
  const g = parseInt(clean.slice(3,5),16)/255;
  const b = parseInt(clean.slice(5,7),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h, s, l = (max+min)/2;
  if(max === min){ h = 0; s = 0; }
  else{
    const d = max - min;
    s = l > 0.5 ? d/(2-max-min) : d/(max+min);
    switch(max){
      case r: h = (g-b)/d + (g<b?6:0); break;
      case g: h = (b-r)/d + 2; break;
      default: h = (r-g)/d + 4;
    }
    h /= 6;
  }
  return { h: h*360, s: s*100, l: l*100 };
}

function hslToHex(h, s, l){
  h = ((h % 360) + 360) % 360;
  s = Math.max(0, Math.min(100, s)) / 100;
  l = Math.max(0, Math.min(100, l)) / 100;
  const c = (1 - Math.abs(2*l - 1)) * s;
  const x = c * (1 - Math.abs((h/60) % 2 - 1));
  const m = l - c/2;
  let r,g,b;
  if(h < 60){ r=c;g=x;b=0; }
  else if(h < 120){ r=x;g=c;b=0; }
  else if(h < 180){ r=0;g=c;b=x; }
  else if(h < 240){ r=0;g=x;b=c; }
  else if(h < 300){ r=x;g=0;b=c; }
  else { r=c;g=0;b=x; }
  const toHex = v => Math.round((v+m)*255).toString(16).padStart(2,'0');
  return '#' + toHex(r) + toHex(g) + toHex(b);
}

function hexToRgbTriplet(hex){
  return parseInt(hex.slice(1,3),16) + ',' + parseInt(hex.slice(3,5),16) + ',' + parseInt(hex.slice(5,7),16);
}

function applyThemeColor(baseHex){
  const valid = /^#[0-9a-fA-F]{6}$/.test(baseHex||'') ? baseHex : DEFAULT_THEME_COLOR;
  const hsl = hexToHsl(valid);
  const sat = Math.min(hsl.s, 60); // clamp so no pick can come out neon-harsh
  const hue = hsl.h;

  const accent500 = hslToHex(hue, sat, 58);
  document.documentElement.style.setProperty('--accent-300', hslToHex(hue, sat, 76));
  document.documentElement.style.setProperty('--accent-500', accent500);
  document.documentElement.style.setProperty('--accent-700', hslToHex(hue, sat, 40));
  document.documentElement.style.setProperty('--accent-rgb', hexToRgbTriplet(accent500));

  const hue2 = hue - 55;
  const sat2 = sat * 0.85;
  const accent2_500 = hslToHex(hue2, sat2, 52);
  document.documentElement.style.setProperty('--accent2-300', hslToHex(hue2, sat2, 74));
  document.documentElement.style.setProperty('--accent2-500', accent2_500);
  document.documentElement.style.setProperty('--accent2-700', hslToHex(hue2, sat2, 36));
  document.documentElement.style.setProperty('--accent2-rgb', hexToRgbTriplet(accent2_500));

  state.themeColor = valid;
}

function renderThemeSwatches(){
  const container = document.getElementById('themeSwatches');
  container.innerHTML = '';
  THEME_PRESETS.forEach(hex=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'theme-swatch' + (state.themeColor.toLowerCase() === hex.toLowerCase() ? ' selected' : '');
    btn.style.background = hex;
    btn.addEventListener('click', ()=>{
      applyThemeColor(hex);
      document.getElementById('customColorInput').value = hex;
      saveState();
      renderThemeSwatches();
    });
    container.appendChild(btn);
  });
}

function initThemePicker(){
  renderThemeSwatches();
  const customInput = document.getElementById('customColorInput');
  customInput.value = state.themeColor;
  customInput.addEventListener('input', ()=>{
    applyThemeColor(customInput.value);
    saveState();
    renderThemeSwatches();
  });
}

/* --------------------------- persistence --------------------------- */
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      apiKey: state.apiKey, model: state.model, lang: state.lang, themeColor: state.themeColor, db: state.db, chatSession: state.chatSession
    }));
  }catch(e){ console.error('saveState failed', e); }
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state.apiKey = parsed.apiKey || '';
      state.model = parsed.model || DEFAULT_MODEL;
      state.lang = parsed.lang === 'en' ? 'en' : 'ar';
      state.themeColor = parsed.themeColor || DEFAULT_THEME_COLOR;
      state.db = parsed.db || emptyDb();
      state.chatSession = parsed.chatSession || null;
    }
  }catch(e){ console.error('loadState failed', e); }
}

/* --------------------------- small helpers --------------------------- */
function esc(str){
  if(str === null || str === undefined) return '';
  const div = document.createElement('div');
  div.textContent = String(str);
  return div.innerHTML;
}
function escAttr(str){ return esc(str).replace(/"/g,'&quot;'); }
function linesToArray(text){ return (text||'').split('\n').map(s=>s.trim()).filter(Boolean); }
function tagsToArray(text){ return (text||'').split(',').map(s=>s.trim()).filter(Boolean); }
function arrayToLines(arr){ return (arr||[]).join('\n'); }
function arrayToTags(arr){ return (arr||[]).join(', '); }
function showStatus(elId, type, html){
  const el = document.getElementById(elId);
  el.className = 'status show status-' + type;
  el.innerHTML = html;
}
function hideStatus(elId){
  const el = document.getElementById(elId);
  el.className = 'status';
  el.innerHTML = '';
}
function setBusy(isBusy){
  ui.busy = isBusy;
  document.querySelectorAll('.btn-primary').forEach(b=> b.disabled = isBusy);
}

function initSettingsTab(){
  document.getElementById('apiKeyInput').value = state.apiKey;
  document.getElementById('modelInput').value = state.model;

  document.getElementById('pwToggleBtn').addEventListener('click', ()=>{
    const input = document.getElementById('apiKeyInput');

    if(input.type === 'password'){ input.type='text'; btn.textContent=t('pw_hide'); }
    else{ input.type='password'; btn.textContent=t('pw_show'); }
  });

  document.getElementById('saveSettingsBtn').addEventListener('click', ()=>{
    state.apiKey = document.getElementById('apiKeyInput').value.trim();
    state.model = document.getElementById('modelInput').value.trim() || DEFAULT_MODEL;
    saveState();
    showStatus('settingsStatus','success', t('msg_settings_saved'));
  });

  document.getElementById('testConnectionBtn').addEventListener('click', testConnection);
  document.getElementById('exportAllBtn').addEventListener('click', ()=>{
    downloadJson({apiKeyPresent: !!state.apiKey, model: state.model, db: state.db, chatSession: state.chatSession}, 'cv-archive-backup.json');
  });

    localStorage.removeItem(STORAGE_KEY);
    const keepLang = state.lang;

    state = { apiKey:'', model:DEFAULT_MODEL, lang:keepLang, themeColor:keepTheme, db: emptyDb(), chatSession:null };

async function testConnection(){
  const apiKey = document.getElementById('apiKeyInput').value.trim();
  const model = document.getElementById('modelInput').value.trim() || DEFAULT_MODEL;
  if(!apiKey){ showStatus('settingsStatus','error', t('msg_need_api_key')); return; }
  showStatus('settingsStatus','info','<div class="spinner"></div> ' + t('msg_testing'));
  setBusy(true);
  try{
    await callOpenAI(apiKey, model,
      'You are a connectivity test endpoint.',
      'Reply with a JSON object confirming the connection works.',
      { type:'object', properties:{ ok:{type:'boolean'}, message:{type:'string'} }, required:['ok','message'], additionalProperties:false },
      'connection_test'
    );
    showStatus('settingsStatus','success', t('msg_connection_ok') + ' (' + esc(model) + ')');
  }catch(err){
    showStatus('settingsStatus','error', t('msg_connection_failed') + esc(err.message));
  }finally{
    setBusy(false);
  }
}

function downloadJson(obj, filename){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* =====================================================================
   OPENAI CALL (Responses API, structured output)
   ===================================================================== */
async function callOpenAIMessages(apiKey, model, messages, jsonSchema, schemaName){
  const res = await fetch(OPENAI_ENDPOINT, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + apiKey },
    body: JSON.stringify({
      model: model,
      input: messages,
      text: { format: { type:'json_schema', name: schemaName, schema: jsonSchema, strict: true } }
    })
  });

  if(!res.ok){
    let msg = 'HTTP ' + res.status;
    try{ const errBody = await res.json(); if(errBody?.error?.message) msg = errBody.error.message; }catch(e){}
    throw new Error(msg);
  }

  const data = await res.json();
  const message = (data.output || []).find(item => item.type === 'message');
  if(!message) throw new Error(t('err_no_model_reply'));
  const textPart = (message.content || []).find(c => c.type === 'output_text');
  if(!textPart){
    const refusal = (message.content || []).find(c => c.type === 'refusal');
    if(refusal) throw new Error(t('err_model_refused') + refusal.refusal);
    throw new Error(t('err_no_text_content'));
  }
  try{
    return JSON.parse(textPart.text);
  }catch(e){
    throw new Error(t('err_invalid_json_reply'));
  }
}

async function callOpenAI(apiKey, model, systemPrompt, userPrompt, jsonSchema, schemaName){
  return callOpenAIMessages(apiKey, model, [
    { role:'system', content: systemPrompt },
    { role:'user', content: userPrompt }
  ], jsonSchema, schemaName);
}

/* --------------------------- generic list-section rendering --------------------------- */
function blankItem(sectionKey){
  const item = {};
  SECTION_CONFIG[sectionKey].fields.forEach(f=>{
    if(f.type==='lines' || f.type==='tags') item[f.key] = [];
    else if(f.type==='checkbox') item[f.key] = false;
    else item[f.key] = '';
  });
  return item;
}

function renderListSectionsContainer(){
  const container = document.getElementById('listSectionsContainer');
  container.innerHTML = Object.keys(SECTION_CONFIG).map(key => renderOneSection(key)).join('');
  // attach events after render
  Object.keys(SECTION_CONFIG).forEach(key=>{
    const addBtn = document.getElementById('add-'+key);
    if(addBtn) addBtn.addEventListener('click', ()=>{ ui.editing[key] = state.db[key].length; renderListSectionsContainer(); });
  });
}

function renderOneSection(sectionKey){
  const config = SECTION_CONFIG[sectionKey];
  const items = state.db[sectionKey] || [];
  const editingIndex = ui.editing[sectionKey];

  let itemsHtml = '';
  items.forEach((item, idx)=>{
    itemsHtml += (editingIndex === idx) ? renderEditForm(sectionKey, item, idx) : renderItemCard(sectionKey, item, idx);
  });
  if(editingIndex === items.length){
    itemsHtml += renderEditForm(sectionKey, blankItem(sectionKey), items.length);
  }
  if(items.length === 0 && editingIndex !== items.length){
    itemsHtml = '<div class="empty-note">' + esc(t(config.emptyKey)) + '</div>';
  }

  return `
  <div class="section-block" data-section="${sectionKey}">
    <div class="section-block-head">
      <h3>${esc(t(config.labelKey))}</h3>
      <span class="count">${items.length} ${esc(t('word_record_count'))}</span>
    </div>
    ${itemsHtml}
    <button class="btn btn-ghost btn-sm" id="add-${sectionKey}" type="button">${esc(t('btn_add_manual'))}</button>
  </div>`;
}

function renderItemCard(sectionKey, item, idx){
  const config = SECTION_CONFIG[sectionKey];
  const stampVal = config.stamp ? config.stamp(item) : null;
  let bulletsHtml = '';
  if(config.bulletsKey && (item[config.bulletsKey]||[]).length){
    bulletsHtml = '<ul>' + item[config.bulletsKey].map(b=>'<li>'+esc(b)+'</li>').join('') + '</ul>';
  }
  let tagsHtml = '';
  if(config.tagsKey && (item[config.tagsKey]||[]).length){
    tagsHtml = '<div class="item-tags">' + item[config.tagsKey].map(t2=>'<span class="chip">'+esc(t2)+'</span>').join('') + '</div>';
  }
  return `
  <div class="item-card">
    ${stampVal ? '<span class="stamp">'+esc(stampVal)+'</span>' : ''}
    <div class="item-card-top">
      <div class="item-title">${esc(config.title(item))}</div>
      <div class="item-sub">${esc(config.sub(item))}</div>
    </div>
    <div class="item-body">${bulletsHtml}${tagsHtml}</div>
    <div class="item-actions">
      <button class="btn btn-ghost btn-sm" onclick="startEditItem('${sectionKey}',${idx})">${esc(t('btn_edit'))}</button>
      <button class="btn btn-danger btn-sm" onclick="deleteItem('${sectionKey}',${idx})">${esc(t('btn_delete'))}</button>
    </div>
  </div>`;
}

function renderEditForm(sectionKey, item, idx){
  const config = SECTION_CONFIG[sectionKey];
  const fieldsHtml = config.fields.map(f=>{
    const val = item[f.key];
    const label = t(f.labelKey);
    if(f.type === 'checkbox'){
      return `<div class="checkbox-field">
        <input type="checkbox" id="f-${sectionKey}-${idx}-${f.key}" ${val?'checked':''}>
        <label for="f-${sectionKey}-${idx}-${f.key}">${esc(label)}</label>
      </div>`;
    }
    if(f.type === 'lines'){
      return `<div class="field">
        <label>${esc(label)}</label>
        <textarea id="f-${sectionKey}-${idx}-${f.key}" rows="3">${esc(arrayToLines(val))}</textarea>
      </div>`;
    }
    if(f.type === 'tags'){
      return `<div class="field">
        <label>${esc(label)}</label>
        <input type="text" id="f-${sectionKey}-${idx}-${f.key}" value="${escAttr(arrayToTags(val))}">
      </div>`;
    }
    return `<div class="field">
      <label>${esc(label)}</label>
      <input type="text" id="f-${sectionKey}-${idx}-${f.key}" value="${escAttr(val)}">
    </div>`;
  }).join('');

  return `
  <div class="edit-form">
    <div class="edit-form-title">${esc(t('edit_record_title'))}</div>
    ${fieldsHtml}
    <div class="btn-row">
      <button class="btn btn-primary btn-sm" onclick="saveItem('${sectionKey}',${idx})">${esc(t('btn_save'))}</button>
      <button class="btn btn-ghost btn-sm" onclick="cancelEditItem('${sectionKey}',${idx})">${esc(t('btn_cancel'))}</button>
    </div>
  </div>`;
}

function startEditItem(sectionKey, idx){ ui.editing[sectionKey] = idx; renderListSectionsContainer(); }
function cancelEditItem(sectionKey, idx){ ui.editing[sectionKey] = null; renderListSectionsContainer(); }

function saveItem(sectionKey, idx){
  const config = SECTION_CONFIG[sectionKey];
  const item = {};
  config.fields.forEach(f=>{
    const el = document.getElementById('f-'+sectionKey+'-'+idx+'-'+f.key);
    if(f.type === 'checkbox') item[f.key] = el.checked;
    else if(f.type === 'lines') item[f.key] = linesToArray(el.value);
    else if(f.type === 'tags') item[f.key] = tagsToArray(el.value);
    else item[f.key] = el.value.trim();
  });
  if(!state.db[sectionKey]) state.db[sectionKey] = [];
  state.db[sectionKey][idx] = item;
  ui.editing[sectionKey] = null;
  saveState();
  renderListSectionsContainer();
}

function deleteItem(sectionKey, idx){
  if(!confirm(t('msg_record_delete_confirm'))) return;
  state.db[sectionKey].splice(idx,1);
  saveState();
  renderListSectionsContainer();
}

Rules:
- NEVER invent, assume, or embellish any fact, number, title, date, or skill that is not explicitly present in the existing database or the new text.
- Merge intelligently: if the new text describes a role, degree, or project already present in the existing database, enrich that existing entry with any additional true detail rather than creating a duplicate entry.
- Preserve everything already in the existing database unless the new text explicitly contradicts or corrects it.
- Assign a short, accurate 'domainTag' (2-4 words, e.g. "Dispatch Operations", "Web Development", "Field Service Coordination") to every work experience and project, based on its actual nature. Use consistent tags for clearly related roles.
- Write bullets as factual accomplishment statements grounded only in what the source text states. Do not add metrics or outcomes that are not stated.
- Group skills into sensible categories (e.g. Technical, Tools & Platforms, Languages, Soft Skills), merging near-duplicate categories.
- Preserve the source text's own language in extracted content (do not translate the candidate's data).

function handleImportDb(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = evt=>{
    try{
      const imported = JSON.parse(evt.target.result);
      state.db = Object.assign(emptyDb(), imported);
      saveState();
      renderDatabaseTab();
      showStatus('dbStatus','success', t('msg_db_imported'));
    }catch(err){
      showStatus('dbStatus','error', t('msg_invalid_json_file'));
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

const INTERVIEW_PREP_SYSTEM_PROMPT = `You are an expert interview coach helping a candidate prepare for a real job interview. You will be given the candidate's full truthful experience database, the target job description, and an honest assessment already computed for how well they match this role, including its identified gaps. Produce realistic interview preparation material.

Rules:
- Use ONLY real experience, skills, and facts present in the candidate's database. Never invent achievements, metrics, or experience not present there.
- Generate realistic, role-specific interview questions a hiring manager would plausibly ask for THIS exact role — mix behavioral, technical or role-specific, and situational questions ("category" should be a short label like "Behavioral", "Technical", or "Situational"). Avoid generic filler; ground questions in what the job description actually emphasizes.
- For each question's "guidance", briefly note which of the candidate's real experiences or achievements would make the strongest answer, and why.
- For "strengthsToHighlight", list specific real talking points grounded in the database that map well to what this job values.
- For "weakPointsToAddress", directly reflect the honest match assessment provided below — identify the specific concerns an interviewer would likely probe given those gaps, and for each, suggest an honest, non-defensive way to address it using real transferable experience. Do not suggest deflecting, minimizing, or being evasive about genuine gaps — suggest honest framing instead.
- For "questionsToAsk", suggest a few genuinely useful, specific questions the candidate could ask the interviewer, grounded in details from the job description.
- All content must be written in English, since the actual interview will be conducted in English.
- Output ONLY the JSON matching the schema.`;

async function handleGenerateInterviewPrep(){
  if(!state.chatSession) return;
  if(!state.apiKey){ showStatus('interviewStatus','error', t('msg_need_api_key_tab')); return; }
  const btn = document.getElementById('generateInterviewBtn');
  btn.disabled = true;
  showStatus('interviewStatus','info','<div class="spinner"></div> ' + t('msg_building_interview_prep'));
  try{
    const userPrompt = 'Before generating the interview prep, use the web_search tool to search for real interview questions commonly asked for this type of role (use the job title and key skills from the job description as search terms). Then combine what you find with your own expertise to produce the most realistic, role-specific prep material possible.\n\nCANDIDATE DATABASE (JSON, ground truth):\n' + JSON.stringify(state.db) +
      '\n\nTARGET JOB DESCRIPTION:\n' + state.chatSession.jobDescription +
      '\n\nHONEST MATCH ASSESSMENT ALREADY COMPUTED FOR THIS ROLE:\n' + JSON.stringify(state.chatSession.matchAnalysis);

    const res = await fetch(OPENAI_ENDPOINT, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + state.apiKey },
      body: JSON.stringify({
        model: state.model,
        input: [
          { role:'system', content: INTERVIEW_PREP_SYSTEM_PROMPT },
          { role:'user', content: userPrompt }
        ],
        tools: [{ type:'web_search_preview' }],
        text: { format: { type:'json_schema', name:'interview_prep', schema: INTERVIEW_PREP_SCHEMA, strict: true } }
      })
    });
    if(!res.ok){
      let msg = 'HTTP ' + res.status;
      try{ const errBody = await res.json(); if(errBody?.error?.message) msg = errBody.error.message; }catch(e){}
      throw new Error(msg);
    }
    const data = await res.json();
    const message = (data.output || []).find(item => item.type === 'message');
    if(!message) throw new Error(t('err_no_model_reply'));
    const textPart = (message.content || []).find(c => c.type === 'output_text');
    if(!textPart) throw new Error(t('err_no_text_content'));
    const result = JSON.parse(textPart.text);

    state.chatSession.interviewPrep = result;
    saveState();
    renderInterviewPrep();
    btn.textContent = t('btn_regenerate_interview_prep');
    hideStatus('interviewStatus');
  }catch(err){
    showStatus('interviewStatus','error', t('msg_error_prefix') + esc(err.message));
  }finally{
    btn.disabled = false;
  }
}

function renderInterviewPrep(){
  const prep = state.chatSession && state.chatSession.interviewPrep;
  const container = document.getElementById('interviewPrepContent');
  if(!prep){ container.style.display = 'none'; container.innerHTML = ''; return; }
  container.style.display = 'block';

  let html = '<div class="interview-section-label">' + esc(t('label_likely_questions')) + '</div>';
  (prep.likelyQuestions||[]).forEach(q=>{
    html += '<div class="interview-question-card">'
      + '<div class="interview-question-cat">' + esc(q.category) + '</div>'
      + '<div class="interview-question-text">' + esc(q.question) + '</div>'
      + '<div class="interview-question-guidance">' + esc(q.guidance) + '</div>'
      + '</div>';
  });

  html += '<div class="interview-section-label" style="margin-top:20px;">' + esc(t('label_strengths_highlight')) + '</div><ul class="interview-list">';
  (prep.strengthsToHighlight||[]).forEach(s=>{ html += '<li>' + esc(s) + '</li>'; });
  html += '</ul>';

  html += '<div class="interview-section-label" style="margin-top:20px;">' + esc(t('label_weak_points')) + '</div>';
  (prep.weakPointsToAddress||[]).forEach(w=>{
    html += '<div class="interview-weakpoint-card">'

      + '</div>';
  });

  html += '<div class="interview-section-label" style="margin-top:20px;">' + esc(t('label_questions_to_ask')) + '</div><ul class="interview-list">';
  (prep.questionsToAsk||[]).forEach(q=>{ html += '<li>' + esc(q) + '</li>'; });
  html += '</ul>';

  container.innerHTML = html;
}

function buildChatSystemPrompt(includeMatchAnalysis){
  const replyLanguageName = state.lang === 'en' ? 'English' : 'Arabic';
  let prompt = `You are an expert resume writer and career strategist helping a candidate whose real experience spans multiple distinct professional domains. You are in an ongoing conversation with the candidate: they gave you a job description and their experience database once (in the first user message), and from now on they will send you follow-up feedback and direction to refine the CV and cover letter. Every time you reply, output the complete, current best version of the tailored CV and cover letter reflecting ALL guidance given so far in the conversation — never a partial diff.

Rules:
- Use ONLY real experience, skills, and facts present in the candidate database provided at the start of the conversation. NEVER invent employers, titles, dates, tools, metrics, or accomplishments that are not in the database — even if the candidate's feedback seems to call for something not present. If their feedback implies adding a fact you don't have, instead reframe using only real material, and say so plainly in changeSummary.
- Select and prioritize the entries most relevant to the job description and to the candidate's stated direction; you may omit clearly irrelevant entries, but never fabricate new ones to fill gaps.
- Reword bullets to mirror the language and priorities of the job description where doing so remains fully factually accurate — this is reframing, not invention.
- All content inside tailoredCV, coverLetter, and matchedDomain must be written in English always, regardless of what language the candidate uses to give you feedback, and regardless of the language used elsewhere in this prompt.
- "changeSummary" is the only field written in a different language: write it in ${replyLanguageName}, 1-3 sentences. On the first turn explain which domain you matched and why; on later turns explain what you changed in response to their feedback. This field is the only thing shown to the candidate directly, so make it clear and specific.`;

  if(includeMatchAnalysis){
    prompt += `

Additionally, on this first message only, honestly assess the fit between this job description and the candidate's REAL database, before doing any tailoring:
- "jdSummary": summarize in ${replyLanguageName}, in 2-4 plain sentences, what the job actually requires and involves — core responsibilities, must-have qualifications, and seniority level. Do not editorialize.
- "matchPercentage": an honest integer 0-100 estimate of how well the candidate's ACTUAL background (not a reframed or optimistic version of it) matches what this job requires. Weight this on hard requirements — years of experience, specific domain, required tools, certifications, education, seniority — as much as on soft overlap. A score of 90+ means the candidate essentially already does this job. A candidate applying outside their real domain, below the required seniority, or missing explicit hard requirements should score well under 50, even if some transferable skills exist. Do not inflate this number to be encouraging.
- "honestVerdict": write in ${replyLanguageName}, 2-4 direct sentences. The candidate explicitly asked for this without flattery or diplomatic softening, so do not hedge with phrases that soften bad news. If this is a stretch or a weak match, say so plainly and name the specific gaps (missing years of experience, wrong domain, missing required certification or tool, seniority mismatch). If it genuinely is a strong match, say that plainly too, without inflating it further. Calibrate to reality, not to encouragement in either direction.`;
  }

  prompt += `

Output ONLY the JSON matching the schema, every time.`;
  return prompt;
}

function getLatestResult(){
  const session = state.chatSession;
  if(!session) return null;
  for(let i = session.turns.length - 1; i >= 0; i--){
    if(session.turns[i].role === 'assistant') return session.turns[i].result;
  }
  return null;
}

function buildChatBaseMessages(includeMatchAnalysis){
  return [
    { role:'system', content: buildChatSystemPrompt(includeMatchAnalysis) },
    { role:'user', content: 'CANDIDATE DATABASE (JSON, ground truth — do not go beyond this):\n' + JSON.stringify(state.db) + '\n\nTARGET JOB DESCRIPTION:\n' + state.chatSession.jobDescription }
  ];
}

function chatTurnsToMessages(turns){
  return turns.map(t2 => t2.role === 'assistant'
    ? { role:'assistant', content: JSON.stringify(t2.result) }
    : { role:'user', content: t2.text }
  );
}

async function startChatSession(){
  const jd = document.getElementById('jobDescArea').value.trim();
  if(!jd){ showStatus('generateStatus','error', t('msg_need_jd')); return; }
  if(!state.apiKey){ showStatus('generateStatus','error', t('msg_need_api_key_tab')); return; }
  const hasAnyData = state.db.workExperience.length || state.db.education.length || state.db.skills.length;
  if(!hasAnyData){ showStatus('generateStatus','error', t('msg_db_empty')); return; }

  state.chatSession = { jobDescription: jd, turns: [], matchAnalysis: null };
  showStatus('generateStatus','info','<div class="spinner"></div> ' + t('msg_building_first'));
  setBusy(true);
  try{
    const result = await callOpenAIMessages(state.apiKey, state.model, buildChatBaseMessages(true), INITIAL_SCHEMA, 'tailored_application_initial');
    state.chatSession.matchAnalysis = {
      jdSummary: result.jdSummary,
      matchPercentage: result.matchPercentage,
      honestVerdict: result.honestVerdict
    };
    state.chatSession.turns.push({ role:'assistant', result });
    saveState();
    renderChat();
    renderResultsFromChat();
    renderMatchAnalysis();
    updateStarButton();
    hideStatus('generateStatus');
  }catch(err){
    state.chatSession = null;
    showStatus('generateStatus','error', t('msg_error_prefix') + esc(err.message));
  }finally{
    setBusy(false);
  }
}

async function sendChatFeedback(text){
  if(!text || !state.chatSession || ui.chatBusy) return;
  if(ui.cvDraft || ui.letterDraft){ showStatus('generateStatus','error', t('msg_finish_manual_edit_first')); return; }
  state.chatSession.turns.push({ role:'user', text });
  ui.chatBusy = true;
  document.getElementById('sendChatBtn').disabled = true;
  document.getElementById('chatInput').disabled = true;
  renderChat();
  try{
    const messages = buildChatBaseMessages(false).concat(chatTurnsToMessages(state.chatSession.turns));
    const result = await callOpenAIMessages(state.apiKey, state.model, messages, CHAT_SCHEMA, 'tailored_application');
    state.chatSession.turns.push({ role:'assistant', result });
    saveState();
    ui.chatBusy = false;
    renderChat();
    renderResultsFromChat();
  }catch(err){
    state.chatSession.turns.pop(); // rollback the optimistic user turn so it isn't left dangling
    ui.chatBusy = false;
    renderChat();
    document.getElementById('chatInput').value = text; // give the message back instead of losing it
    showStatus('generateStatus','error', t('msg_error_prefix') + esc(err.message));
  }finally{
    document.getElementById('sendChatBtn').disabled = false;
    document.getElementById('chatInput').disabled = false;
  }
}

  document.getElementById('sendChatBtn').addEventListener('click', sendFromInput);
  chatInput.addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); sendFromInput(); } });
  document.querySelectorAll('.chat-suggestion-chip').forEach(chip=>{
    chip.addEventListener('click', ()=> sendChatFeedback(chip.getAttribute('data-msg')));
  });

  if(state.chatSession && state.chatSession.turns.length){
    document.getElementById('jobDescArea').value = state.chatSession.jobDescription || '';
    renderChat();
    renderResultsFromChat();
    renderMatchAnalysis();
    if(state.chatSession.interviewPrep){
      renderInterviewPrep();
      document.getElementById('generateInterviewBtn').textContent = t('btn_regenerate_interview_prep');
    }
  }
}

function renderMatchAnalysis(){
  const card = document.getElementById('matchAnalysisCard');
  const ma = state.chatSession && state.chatSession.matchAnalysis;
  if(!ma){ card.style.display = 'none'; return; }
  card.style.display = 'block';
  const pct = Math.max(0, Math.min(100, Math.round(ma.matchPercentage)));
  document.getElementById('matchPercentageValue').textContent = pct + '%';
  document.getElementById('matchPercentageFill').style.width = pct + '%';
  document.getElementById('jdSummaryText').textContent = ma.jdSummary;
  document.getElementById('honestVerdictText').textContent = ma.honestVerdict;
}

function setStyle(styleName){
  ui.pdfStyle = styleName;
  document.getElementById('swatchSimple').classList.toggle('selected', styleName==='simple');
  document.getElementById('swatchPro').classList.toggle('selected', styleName==='professional');
  renderResultsFromChat();
}

function renderChat(){
  const session = state.chatSession;
  const chatCard = document.getElementById('chatCard');
  if(!session || !session.turns.length){ chatCard.style.display = 'none'; return; }
  chatCard.style.display = 'block';

  let html = '';
  session.turns.forEach(turn=>{
    html += turn.role === 'user'
      ? '<div class="chat-bubble user">' + esc(turn.text) + '</div>'
      : '<div class="chat-bubble assistant">' + esc(turn.result.changeSummary) + '</div>';
  });
  if(ui.chatBusy){
    html += '<div class="chat-bubble assistant loading"><div class="spinner"></div> ' + esc(t('chat_typing')) + '</div>';
  }
  const log = document.getElementById('chatLog');
  log.innerHTML = html;
  log.scrollTop = log.scrollHeight;

  const latest = getLatestResult();
  document.getElementById('domainBadge').textContent = latest ? latest.matchedDomain : '';
}

function renderResultsFromChat(){
  const r = getLatestResult();
  if(!r){ document.getElementById('resultsWrap').style.display = 'none'; return; }
  document.getElementById('resultsWrap').style.display = 'block';
  if(!ui.cvDraft) document.getElementById('cvPreview').innerHTML = buildCvHtml(r.tailoredCV, ui.pdfStyle);
  if(!ui.letterDraft) document.getElementById('letterPreview').innerHTML = buildLetterHtml(r.tailoredCV, r.coverLetter, ui.pdfStyle);
}

/* =====================================================================
   MANUAL EDITING of the generated CV / cover letter
   No AI mediation here — direct field editing, same authority level as
   editing the database directly. Lets the person fix or reorder anything
   (e.g. swap which role is listed first) without arguing with the model
   about facts it is correctly refusing to alter on its own.
   ===================================================================== */
const CV_WE_FIELDS = [
  {key:'title', labelKey:'fld_we_title', type:'text'},
  {key:'company', labelKey:'fld_we_company', type:'text'},
  {key:'location', labelKey:'fld_we_location', type:'text'},
  {key:'startDate', labelKey:'fld_we_startDate', type:'text'},
  {key:'endDate', labelKey:'fld_we_endDate', type:'text'},
  {key:'isCurrent', labelKey:'fld_we_isCurrent', type:'checkbox'},
  {key:'bullets', labelKey:'fld_we_bullets', type:'lines'}
];
const CV_EDU_FIELDS = [
  {key:'institution', labelKey:'fld_edu_institution', type:'text'},
  {key:'degree', labelKey:'fld_edu_degree', type:'text'},
  {key:'field', labelKey:'fld_edu_field', type:'text'},
  {key:'endDate', labelKey:'fld_edu_endDate', type:'text'}
];
const CV_CERT_FIELDS = [
  {key:'name', labelKey:'fld_cert_name', type:'text'},
  {key:'issuer', labelKey:'fld_cert_issuer', type:'text'},
  {key:'date', labelKey:'fld_cert_date', type:'text'}
];
const CV_PROJ_FIELDS = [
  {key:'name', labelKey:'fld_proj_name', type:'text'},
  {key:'bullets', labelKey:'fld_proj_bullets', type:'lines'}
];

const DRAFT_ARRAY_REGISTRY = {
  'cved-we':   { getArray:()=>ui.cvDraft.workExperience,  fields:CV_WE_FIELDS,   blank:()=>({title:'',company:'',location:'',startDate:'',endDate:'',isCurrent:false,bullets:[]}) },
  'cved-edu':  { getArray:()=>ui.cvDraft.education,        fields:CV_EDU_FIELDS,  blank:()=>({institution:'',degree:'',field:'',endDate:''}) },
  'cved-cert': { getArray:()=>ui.cvDraft.certifications,   fields:CV_CERT_FIELDS, blank:()=>({name:'',issuer:'',date:''}) },
  'cved-proj': { getArray:()=>ui.cvDraft.projects,         fields:CV_PROJ_FIELDS, blank:()=>({name:'',bullets:[]}) }
};

function renderDraftArrayEditor(itemsArray, idPrefix, fieldDefs, summaryFn){
  let html = '';
  itemsArray.forEach((item, i)=>{
    const fieldsHtml = fieldDefs.map(f=>{
      const val = item[f.key];
      const fid = idPrefix+'-'+i+'-'+f.key;
      const label = t(f.labelKey);
      if(f.type === 'checkbox'){
        return `<div class="checkbox-field"><input type="checkbox" id="${fid}" ${val?'checked':''}><label for="${fid}">${esc(label)}</label></div>`;
      }
      if(f.type === 'lines'){
        return `<div class="field"><label>${esc(label)}</label><textarea id="${fid}" rows="3">${esc(arrayToLines(val))}</textarea></div>`;
      }
      return `<div class="field"><label>${esc(label)}</label><input type="text" id="${fid}" value="${escAttr(val)}"></div>`;
    }).join('');
    html += `
    <div class="edit-form">
      <div class="edit-form-title">${esc(summaryFn(item))}</div>
      ${fieldsHtml}
      <div class="btn-row">
        <button class="btn btn-ghost btn-sm" type="button" onclick="moveDraftItem('${idPrefix}',${i},-1)">${esc(t('btn_move_up'))}</button>
        <button class="btn btn-ghost btn-sm" type="button" onclick="moveDraftItem('${idPrefix}',${i},1)">${esc(t('btn_move_down'))}</button>
        <button class="btn btn-danger btn-sm" type="button" onclick="deleteDraftItem('${idPrefix}',${i})">${esc(t('btn_delete'))}</button>
      </div>
    </div>`;
  });
  html += `<button class="btn btn-ghost btn-sm" type="button" onclick="addDraftItem('${idPrefix}')">${esc(t('btn_add_manual'))}</button>`;
  return html;
}

function readDraftArray(idPrefix, fields, count){
  const arr = [];
  for(let i=0;i<count;i++){
    const item = {};
    fields.forEach(f=>{
      const el = document.getElementById(idPrefix+'-'+i+'-'+f.key);
      if(!el) return;
      if(f.type === 'checkbox') item[f.key] = el.checked;
      else if(f.type === 'lines') item[f.key] = linesToArray(el.value);
      else item[f.key] = el.value.trim();
    });
    arr.push(item);
  }
  return arr;
}

function readCvFormIntoDraft(){
  const d = ui.cvDraft;
  d.fullName = document.getElementById('cved-fullName').value.trim();
  d.headline = document.getElementById('cved-headline').value.trim();
  d.email = document.getElementById('cved-email').value.trim();
  d.phone = document.getElementById('cved-phone').value.trim();
  d.location = document.getElementById('cved-location').value.trim();
  d.linkedin = document.getElementById('cved-linkedin').value.trim();
  d.website = document.getElementById('cved-website').value.trim();
  d.summary = document.getElementById('cved-summary').value.trim();
  d.coreSkills = tagsToArray(document.getElementById('cved-coreSkills').value);
  d.workExperience = readDraftArray('cved-we', CV_WE_FIELDS, d.workExperience.length);
  d.education = readDraftArray('cved-edu', CV_EDU_FIELDS, d.education.length);
  d.certifications = readDraftArray('cved-cert', CV_CERT_FIELDS, d.certifications.length);
  d.projects = readDraftArray('cved-proj', CV_PROJ_FIELDS, d.projects.length);
}

function readLetterFormIntoDraft(){
  const d = ui.letterDraft;
  d.salutation = document.getElementById('lted-salutation').value.trim();
  d.closing = document.getElementById('lted-closing').value.trim();
  const paras = [];
  for(let i=0;i<d.paragraphs.length;i++){
    const el = document.getElementById('lted-para-'+i);
    if(el) paras.push(el.value.trim());
  }
  d.paragraphs = paras;
}

function moveDraftItem(idPrefix, index, direction){
  readCvFormIntoDraft();
  const arr = DRAFT_ARRAY_REGISTRY[idPrefix].getArray();
  const j = index + direction;
  if(j < 0 || j >= arr.length) return;
  const tmp = arr[index]; arr[index] = arr[j]; arr[j] = tmp;
  renderCvEditForm();
}
function deleteDraftItem(idPrefix, index){
  readCvFormIntoDraft();
  DRAFT_ARRAY_REGISTRY[idPrefix].getArray().splice(index,1);
  renderCvEditForm();
}
function addDraftItem(idPrefix){
  readCvFormIntoDraft();
  DRAFT_ARRAY_REGISTRY[idPrefix].getArray().push(DRAFT_ARRAY_REGISTRY[idPrefix].blank());
  renderCvEditForm();
}

function moveParagraph(i, dir){
  readLetterFormIntoDraft();
  const arr = ui.letterDraft.paragraphs;
  const j = i + dir;
  if(j < 0 || j >= arr.length) return;
  const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  renderLetterEditForm();
}
function deleteParagraph(i){
  readLetterFormIntoDraft();
  ui.letterDraft.paragraphs.splice(i,1);
  renderLetterEditForm();
}
function addParagraph(){
  readLetterFormIntoDraft();
  ui.letterDraft.paragraphs.push('');
  renderLetterEditForm();
}

function renderLetterParagraphsEditor(){
  let html = '';
  ui.letterDraft.paragraphs.forEach((p,i)=>{
    html += `
    <div class="edit-form">
      <div class="edit-form-title">${esc(t('word_paragraph'))} ${i+1}</div>
      <textarea id="lted-para-${i}" rows="3">${esc(p)}</textarea>
      <div class="btn-row" style="margin-top:10px;">
        <button class="btn btn-ghost btn-sm" type="button" onclick="moveParagraph(${i},-1)">${esc(t('btn_move_up'))}</button>
        <button class="btn btn-ghost btn-sm" type="button" onclick="moveParagraph(${i},1)">${esc(t('btn_move_down'))}</button>
        <button class="btn btn-danger btn-sm" type="button" onclick="deleteParagraph(${i})">${esc(t('btn_delete'))}</button>
      </div>
    </div>`;
  });
  html += `<button class="btn btn-ghost btn-sm" type="button" onclick="addParagraph()">${esc(t('btn_add_manual'))}</button>`;
  return html;
}

/* --------------------------- CV / letter HTML builders (always English — fixed deliverable, not app UI) --------------------------- */
function contactLine(cv){
  const parts = [cv.email, cv.phone, cv.location, cv.linkedin, cv.website].filter(Boolean);
  return parts.map(p=>'<span>'+esc(p)+'</span>').join('');
}

function buildCvHtml(cv, style){
  const expHtml = (cv.workExperience||[]).map(e=>`
    <div class="entry">
      <div class="entry-top">
        <span class="entry-title">${esc(e.title)} <span class="entry-org">— ${esc(e.company)}</span></span>
        <span class="entry-date">${esc([e.startDate, e.isCurrent?'Present':e.endDate].filter(Boolean).join(' – '))}</span>
      </div>
      ${e.location?'<div style="font-size:11px;color:#777;">'+esc(e.location)+'</div>':''}
      ${(e.bullets&&e.bullets.length)?'<ul>'+e.bullets.map(b=>'<li>'+esc(b)+'</li>').join('')+'</ul>':''}
    </div>`).join('');

  const eduHtml = (cv.education||[]).map(e=>`
    <div class="entry">
      <div class="entry-top">
        <span class="entry-title">${esc(e.degree)}${e.field?' in '+esc(e.field):''}</span>
        <span class="entry-date">${esc(e.endDate||'')}</span>
      </div>
      <div style="font-size:12px;color:#333;">${esc(e.institution)}</div>
    </div>`).join('');

  const certHtml = (cv.certifications||[]).map(c=>`
    <div class="entry"><div class="entry-top"><span class="entry-title">${esc(c.name)}</span><span class="entry-date">${esc(c.date||'')}</span></div>${c.issuer?'<div style="font-size:11px;color:#666;">'+esc(c.issuer)+'</div>':''}</div>`).join('');

  const projHtml = (cv.projects||[]).map(p=>`
    <div class="entry"><div class="entry-title">${esc(p.name)}</div>${(p.bullets&&p.bullets.length)?'<ul>'+p.bullets.map(b=>'<li>'+esc(b)+'</li>').join('')+'</ul>':''}</div>`).join('');

  if(style === 'professional'){
    return `<div class="pdf-doc">
      <div class="pdf-pro-band">
        <div class="name">${esc(cv.fullName)}</div>
        <div class="headline">${esc(cv.headline)}</div>
        <div class="contact">${contactLine(cv)}</div>
      </div>
      <div class="pdf-pro-body">
        ${cv.summary?'<div class="sec-title">Summary</div><div class="summary-text">'+esc(cv.summary)+'</div>':''}
        ${(cv.coreSkills&&cv.coreSkills.length)?'<div class="sec-title">Core Skills</div><div>'+cv.coreSkills.map(s=>'<span class="skill-chip">'+esc(s)+'</span>').join('')+'</div>':''}
        ${expHtml?'<div class="sec-title">Experience</div>'+expHtml:''}
        ${eduHtml?'<div class="sec-title">Education</div>'+eduHtml:''}
        ${certHtml?'<div class="sec-title">Certifications</div>'+certHtml:''}
        ${projHtml?'<div class="sec-title">Projects</div>'+projHtml:''}
      </div>
    </div>`;
  }

  return `<div class="pdf-doc pdf-simple">
    <div class="name">${esc(cv.fullName)}</div>
    <div class="headline">${esc(cv.headline)}</div>
    <div class="contact">${contactLine(cv)}</div>
    <hr>
    ${cv.summary?'<div class="sec-title">Summary</div><div class="summary-text">'+esc(cv.summary)+'</div>':''}
    ${(cv.coreSkills&&cv.coreSkills.length)?'<div class="sec-title">Core Skills</div><div class="skills-line">'+esc(cv.coreSkills.join(' · '))+'</div>':''}
    ${expHtml?'<div class="sec-title">Experience</div>'+expHtml:''}
    ${eduHtml?'<div class="sec-title">Education</div>'+eduHtml:''}
    ${certHtml?'<div class="sec-title">Certifications</div>'+certHtml:''}
    ${projHtml?'<div class="sec-title">Projects</div>'+projHtml:''}
  </div>`;
}

function buildLetterHtml(cv, letter, style){
  const dateStr = new Date().toLocaleDateString('en-US', {year:'numeric', month:'long', day:'numeric'});
  const paragraphsHtml = (letter.paragraphs||[]).map(p=>'<p>'+esc(p)+'</p>').join('');
  const header = style === 'professional'
    ? `<div class="pdf-pro-band"><div class="name">${esc(cv.fullName)}</div><div class="headline">${esc(cv.headline)}</div><div class="contact">${contactLine(cv)}</div></div>`
    : `<div class="pdf-simple" style="padding-bottom:0;"><div class="name">${esc(cv.fullName)}</div><div class="contact">${contactLine(cv)}</div><hr></div>`;

  return `<div class="pdf-doc">
    ${header}
    <div class="pdf-letter-body">
      <div class="date">${esc(dateStr)}</div>
      <div class="salutation">${esc(letter.salutation)}</div>
      ${paragraphsHtml}
      <div class="closing">
        <p style="margin-bottom:0;">${esc(letter.closing)}</p>
        <div class="name">${esc(cv.fullName)}</div>
      </div>
    </div>
  </div>`;
}
