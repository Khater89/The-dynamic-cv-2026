function exportPdf(kind){
  if(kind === 'cv' && ui.cvDraft) saveCvEdit();
  if(kind === 'letter' && ui.letterDraft) saveLetterEdit();
  const r = getLatestResult();
  if(!r) return;
  const html = (kind === 'cv') ? buildCvHtml(r.tailoredCV, ui.pdfStyle) : buildLetterHtml(r.tailoredCV, r.coverLetter, ui.pdfStyle);
  const safeName = (r.tailoredCV.fullName || 'candidate').replace(/[^a-zA-Z0-9]+/g,'_');
  const title = (kind === 'cv' ? safeName+'_CV' : safeName+'_Cover_Letter');

  const printWin = window.open('', '_blank');
  if(!printWin){
    showStatus('generateStatus','error', t('msg_pdf_export_failed') + 'Popup blocked. Allow popups for this site and try again.');
    return;
  }

  printWin.document.write('<!DOCTYPE html><html lang="en" dir="ltr"><head><meta charset="UTF-8">'
    + '<title>' + esc(title) + '</title>'
    + '<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">'
    + '<style>' + getPdfStyles() + '</style>'
    + '</head><body>' + html
    + '<scr' + 'ipt>'
    + 'document.fonts.ready.then(function(){ setTimeout(function(){ window.print(); }, 400); });'
    + '</scr' + 'ipt></body></html>');
  printWin.document.close();
}

/* =====================================================================
   SAVED JOBS — persisted separately from chatSession (which holds the
   *active* session), under their own localStorage key. Each saved job
   is a self-contained snapshot that can be restored into chatSession.
   ===================================================================== */
const SAVED_JOBS_KEY = 'cvArchiveSavedJobs_v1';

function loadSavedJobs(){
  try{
    const raw = localStorage.getItem(SAVED_JOBS_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}

function persistSavedJobs(jobs){
  try{ localStorage.setItem(SAVED_JOBS_KEY, JSON.stringify(jobs)); }catch(e){ console.error('persistSavedJobs failed', e); }
}

function isCurrentJobSaved(){
  if(!state.chatSession) return false;
  const jobs = loadSavedJobs();
  const jd = state.chatSession.jobDescription;
  return jobs.some(j=> j.jobDescription === jd);
}

function toggleSaveCurrentJob(){
  if(!state.chatSession) return;
  // allow saving even without matchAnalysis (star should always work once there's a session)
  const jobs = loadSavedJobs();
  const jd = state.chatSession.jobDescription;
  const existingIdx = jobs.findIndex(j=> j.jobDescription === jd);

  // if already saved → unsave on click
  if(existingIdx >= 0){
    jobs.splice(existingIdx, 1);
    persistSavedJobs(jobs);
    updateStarButton();
    renderSavedJobsList();
    showStatus('generateStatus','info', t('msg_job_unsaved'));
    return;
  }

  // not yet saved → show the naming modal
  const r = getLatestResult();
  const defaultName = r ? r.matchedDomain : '';
  const input = document.getElementById('saveJobNameInput');
  input.value = defaultName;
  document.getElementById('saveJobModal').classList.add('show');
  input.focus();
}

function confirmSaveJob(){
  const input = document.getElementById('saveJobNameInput');
  const name = input.value.trim() || (getLatestResult() ? getLatestResult().matchedDomain : 'Untitled');
  document.getElementById('saveJobModal').classList.remove('show');

  const jobs = loadSavedJobs();
  const r = getLatestResult();
  const ma = state.chatSession.matchAnalysis;
  jobs.unshift({
    savedAt: new Date().toISOString(),
    customName: name,
    jobDescription: state.chatSession.jobDescription,
    matchAnalysis: ma || null,
    matchedDomain: r ? r.matchedDomain : '',
    turns: state.chatSession.turns,
    interviewPrep: state.chatSession.interviewPrep || null,
    jdSnippet: state.chatSession.jobDescription.slice(0, 120).replace(/\s+/g,' ')
  });
  persistSavedJobs(jobs);
  updateStarButton();
  renderSavedJobsList();
  showStatus('generateStatus','success', t('msg_job_saved'));
}

function cancelSaveJob(){
  document.getElementById('saveJobModal').classList.remove('show');
}

function updateStarButton(){
  const btn = document.getElementById('saveJobBtn');
  if(!btn) return;
  const saved = isCurrentJobSaved();
  btn.textContent = saved ? '★' : '☆';
  btn.classList.toggle('starred', saved);
}

function restoreSavedJob(index){
  const jobs = loadSavedJobs();
  const job = jobs[index];
  if(!job) return;
  state.chatSession = {
    jobDescription: job.jobDescription,
    matchAnalysis: job.matchAnalysis,
    turns: job.turns,
    interviewPrep: job.interviewPrep || null
  };
  saveState();
  // switch to generate tab
  document.querySelectorAll('.rail-tab').forEach(el=> el.classList.toggle('active', el.getAttribute('data-tab') === 'generate'));
  document.querySelectorAll('.panel').forEach(p=> p.classList.toggle('active', p.id === 'panel-generate'));
  document.getElementById('jobDescArea').value = job.jobDescription;
  renderChat();
  renderResultsFromChat();
  renderMatchAnalysis();
  updateStarButton();
  if(job.interviewPrep){
    renderInterviewPrep();
    document.getElementById('generateInterviewBtn').textContent = t('btn_regenerate_interview_prep');
  }
  showStatus('generateStatus','success', t('msg_job_restored'));
}

function deleteSavedJob(index){
  if(!confirm(t('msg_delete_saved_confirm'))) return;
  const jobs = loadSavedJobs();
  jobs.splice(index, 1);
  persistSavedJobs(jobs);
  renderSavedJobsList();
  updateStarButton();
}

function renderSavedJobsList(){
  const container = document.getElementById('savedJobsList');
  if(!container) return;
  const jobs = loadSavedJobs();
  if(jobs.length === 0){
    container.innerHTML = '<div class="empty-note">' + esc(t('saved_empty')) + '</div>';
    return;
  }
  container.innerHTML = jobs.map((job, i)=>{
    const pct = job.matchAnalysis ? job.matchAnalysis.matchPercentage : '?';
    const pctColor = pct >= 70 ? 'var(--good-300)' : pct >= 40 ? 'var(--paper-300)' : 'var(--bad-300)';
    const dateStr = job.savedAt ? new Date(job.savedAt).toLocaleDateString() : '';
    const displayName = job.customName || job.matchedDomain || job.jdSnippet || '';
    return `<div class="saved-job-card">
      <div class="saved-job-info">
        <div class="saved-job-domain">${esc(job.matchedDomain || '')}</div>
        <div class="saved-job-title">${esc(displayName)}</div>
        <div class="saved-job-match" style="color:${pctColor};">${pct}% ${t('match_analysis_title').toLowerCase()}</div>
        <div class="saved-job-date">${esc(dateStr)}</div>
      </div>
      <div class="saved-job-actions">
        <button class="btn btn-ghost btn-sm" onclick="restoreSavedJob(${i})">${esc(t('btn_restore'))}</button>
        <button class="btn btn-danger btn-sm" onclick="deleteSavedJob(${i})">${esc(t('btn_delete'))}</button>
      </div>
    </div>`;
  }).join('');
}

/* =====================================================================
   LANDING PAGE — shown once (or on first visit), then hidden on click.
   ===================================================================== */
function initLandingPage(){
  const landing = document.getElementById('landingPage');
  const appShell = document.querySelector('.app-shell');
  const visited = localStorage.getItem('cvArchiveVisited');
  if(visited){
    landing.classList.add('hidden');
    appShell.style.display = 'flex';
  }else{
    landing.classList.remove('hidden');
    appShell.style.display = 'none';
  }
  document.getElementById('landingStartBtn').addEventListener('click', ()=>{
    landing.classList.add('hidden');
    appShell.style.display = 'flex';
    localStorage.setItem('cvArchiveVisited', '1');
  });
}

/* =====================================================================
   BOOT
   ===================================================================== */
function boot(){
  loadState();
  applyThemeColor(state.themeColor);
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('.lang-btn').forEach(b=> b.classList.toggle('active', b.getAttribute('data-lang') === state.lang));
  const chatInputEl = document.getElementById('chatInput');
  if(chatInputEl) chatInputEl.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  applyStaticTranslations();
  initLangSwitch();
  initThemePicker();
  initTabs();
  initSettingsTab();
  initDatabaseTab();
  initGenerateTab();
  document.getElementById('saveJobBtn').addEventListener('click', toggleSaveCurrentJob);
  document.getElementById('saveJobConfirmBtn').addEventListener('click', confirmSaveJob);
  document.getElementById('saveJobCancelBtn').addEventListener('click', cancelSaveJob);
  document.getElementById('saveJobNameInput').addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); confirmSaveJob(); } });
  renderSavedJobsList();
  initLandingPage();
}
document.addEventListener('DOMContentLoaded', boot);
</script>
